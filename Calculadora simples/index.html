<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Operações js</title>
</head>
<body>
    <header>
        <h1>Calculadora</h1>
    </header>
    <section>
        <h3>Digite dois numeros e tambem o operador</h3>
        <div>Numero 01: <input type="number" id="n1"></div>
        <div>Numero 02: <input type="number" id="n2"></div>
        <div>Operador: <input type="text" id="operador"></div>
        
        <table>
            
            <tr>
                <th>Soma</th>
                <th>Subtração</th>
                <th>Multiplicação</th>
                <th>Divição</th>
            </tr>

            <tr>
                <td>+</td>
                <td>-</td>
                <td>*</td>
                <td>/</td>
            </tr>

        
        </table>
        <div><input type="button" value="Enviar" id="btnenviar"></div>
        <div id="resp">Aguardando dados</div>
        
    </section>
    <footer>
        &copy;Murilo Uggioni da Silva
    </footer>
    <script type="module" src="index.js"></script>
</body>
</html>
